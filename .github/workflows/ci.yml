name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ui-lock-renderer.test.ts compares the current renderer with the
          # retained-lock version from an ancestor commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration and UI tests (UI tests drive the real renderer in Chromium)
        run: npm test
      - name: Clean UI/runtime build
        run: npm run ui:build
      - name: Source-vs-dist consistency
        run: npm run verify:dist
